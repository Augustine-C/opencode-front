name: Build client

on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*.[0-9]*", "0.0.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        # Bun 1.3.14 re-resolves the patched Git dependency even with a current lockfile.
        run: bun install --linker=hoisted
      - name: Build frontend
        run: bun run build
      - name: Stage desktop app
        id: stage
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            node scripts/desktop-stage.cjs "$REF_NAME"
          else
            node scripts/desktop-stage.cjs
          fi
          node -e 'const pkg = require("./dist/desktop-app/package.json"); console.log("version=" + (process.platform === "win32" ? pkg.releaseVersion : pkg.version.split("+")[0]))' >> "$GITHUB_OUTPUT"
      - name: Package desktop app
        if: runner.os == 'Windows'
        run: >-
          bunx @electron/packager@19.0.1 dist/desktop-app OpenCode-Front
          --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
          --electron-version=44.4.5 --build-version=${{ steps.stage.outputs.version }}
          --out=dist/desktop --overwrite
      - name: Package and ad hoc sign macOS app
        if: runner.os == 'macOS'
        # Ad hoc signatures have no Team ID, so disable hardened runtime library validation.
        run: >-
          bunx @electron/packager@19.0.1 dist/desktop-app OpenCode-Front
          --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
          --electron-version=44.4.5 --build-version=${{ steps.stage.outputs.version }}
          --out=dist/desktop --overwrite
          --osx-sign.identity=-
          --no-osx-sign.identityValidation
          --no-osx-sign.continueOnError
          --no-osx-sign.hardenedRuntime
      - name: Verify ad hoc macOS signature
        if: runner.os == 'macOS'
        env:
          APP_PATH: dist/desktop/OpenCode-Front-darwin-arm64/OpenCode-Front.app
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" 2>&1 | grep -F 'Signature=adhoc'
          python3 - <<'PY'
          import os
          import signal
          import subprocess
          import sys
          import tempfile
          import time

          executable = os.path.join(os.environ["APP_PATH"], "Contents/MacOS/OpenCode-Front")
          with tempfile.TemporaryFile() as output:
              process = subprocess.Popen([executable], stdout=output, stderr=output, start_new_session=True)
              try:
                  deadline = time.monotonic() + 15
                  while time.monotonic() < deadline:
                      if process.poll() is not None:
                          output.seek(0)
                          sys.stderr.write(output.read().decode(errors="replace"))
                          raise SystemExit(f"Electron exited during launch with status {process.returncode}")
                      time.sleep(0.5)

                  processes = subprocess.run(["ps", "-axo", "pid=,command="], capture_output=True, text=True, check=True)
                  if not any("OpenCode-Front Helper" in line and "--type=renderer" in line for line in processes.stdout.splitlines()):
                      output.seek(0)
                      sys.stderr.write(output.read().decode(errors="replace"))
                      raise SystemExit("Electron did not start a renderer helper")
              finally:
                  try:
                      os.killpg(process.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      process.wait()
          PY
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: >-
          tar -czf dist/opencode-front-macos-${{ matrix.arch }}.tar.gz
          -C dist/desktop OpenCode-Front-darwin-${{ matrix.arch }}
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/desktop/OpenCode-Front-win32-x64 -DestinationPath dist/opencode-front-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/opencode-front-*.tar.gz
            dist/opencode-front-*.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          merge-multiple: true
          path: artifacts
      - name: Archive frontend plugin examples
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -qr "artifacts/opencode-front-example-plugins-${RELEASE_TAG}.zip" examples/frontend-plugins
      - name: Create release and upload builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
