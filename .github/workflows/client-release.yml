name: Build client

on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*.[0-9]*", "0.0.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        # Bun 1.3.14 re-resolves the patched Git dependency even with a current lockfile.
        run: bun install --linker=hoisted
      - name: Build frontend
        run: bun run build
      - name: Stage desktop app
        id: stage
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            node scripts/desktop-stage.cjs "$REF_NAME"
          else
            node scripts/desktop-stage.cjs
          fi
          node -e 'const pkg = require("./dist/desktop-app/package.json"); console.log("version=" + (process.platform === "win32" ? pkg.releaseVersion : pkg.version.split("+")[0]))' >> "$GITHUB_OUTPUT"
      - name: Package desktop app
        run: node scripts/desktop-package.mjs '${{ matrix.platform }}' '${{ matrix.arch }}' '${{ steps.stage.outputs.version }}'
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: >-
          tar -czf dist/opencode-front-macos-${{ matrix.arch }}.tar.gz
          -C dist/desktop OpenCode-Front-darwin-${{ matrix.arch }}
      - name: Verify archived macOS signatures and launch
        if: runner.os == 'macOS'
        env:
          ARCHIVE_PATH: dist/opencode-front-macos-${{ matrix.arch }}.tar.gz
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          tar -xzf "$ARCHIVE_PATH" -C "$VERIFY_DIR"
          python3 scripts/desktop-verify-macos.py "$VERIFY_DIR/OpenCode-Front-darwin-arm64/OpenCode-Front.app"
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/desktop/OpenCode-Front-win32-x64 -DestinationPath dist/opencode-front-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/opencode-front-*.tar.gz
            dist/opencode-front-*.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          merge-multiple: true
          path: artifacts
      - name: Archive frontend plugin examples
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -qr "artifacts/opencode-front-example-plugins-${RELEASE_TAG}.zip" examples/frontend-plugins
      - name: Create release and upload builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber

  update-2-0-26-5-release-notes:
    name: Update 2.0.26.5 release description
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'chore(release): expand 2.0.26.5 release description'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Replace release description with complete notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/release-2.0.26.5.md" <<'RELEASE_NOTES'
          # OpenCode Front 2.0.26.5
          
          Port revision 5 for upstream OpenCode v2.0.26. The app uses version 2.0.26+5. It connects to an existing compatible OpenCode service; the desktop archive does not bundle a backend.
          
          ## Changes included
          
          - **Upstream v2.0.25 frontend updates:** read only Word, Excel, and PowerPoint previews; recently closed tabs; recent sessions in the command menu; improved mobile navigation and layout; clearer streaming and pending tool state; Markdown selection and math parsing fixes; and more consistent pairing and connection flows.
          - **Upstream v2.0.26 updates:** faster snapshot and Git tree processing, refreshed model data and Google Cloud credential support for Vertex, less guessable remote access subdomains, and terminal link and summary improvements.
          - **OpenCode Front features:** group session tabs by project, manage frontend plugins with the plugin SDK, use the separate example plugin source archive, and connect through the CodeArts Proxy extension.
          - **macOS launch fix:** the prior signing command left hardened runtime enabled on the app, Electron helpers, and framework binaries. With ad hoc signatures this made macOS reject Electron Framework during launch. This release disables hardened runtime for each signed binary.
          
          ## Build verification
          
          The tagged GitHub Actions run completed successfully for macOS arm64, Windows x64, and release publishing. On the extracted macOS archive, CI verified all 13 Mach-O signatures, confirmed they are ad hoc signed without hardened runtime or library validation flags, and launched the app with a renderer helper. CI used macOS 15; macOS 27 was not directly available for testing.
          
          ## Downloads
          
          | File | Platform / contents | Size | SHA-256 |
          | --- | --- | ---: | --- |
          | [opencode-front-macos-arm64.tar.gz](https://github.com/Augustine-C/opencode-front/releases/download/2.0.26.5/opencode-front-macos-arm64.tar.gz) | macOS Apple Silicon | 173,990,479 bytes | `679f82720b329cbb87a178ca9f76f45c393cb17e4628b75529545f5dc720f51b` |
          | [opencode-front-windows-x64.zip](https://github.com/Augustine-C/opencode-front/releases/download/2.0.26.5/opencode-front-windows-x64.zip) | Windows x64 | 207,001,592 bytes | `cb49c302500d7fd7a950130c6fcdcd8fee58ab14da192fd08b98b26373df1e3a` |
          | [opencode-front-example-plugins-2.0.26.5.zip](https://github.com/Augustine-C/opencode-front/releases/download/2.0.26.5/opencode-front-example-plugins-2.0.26.5.zip) | Example plugin source modules | 7,541 bytes | `bd4bc1e8bb76787e1114e6619e3abaeba21253b068205daeb1ba7877632229b1` |
          
          The macOS app is ad hoc signed and not notarized. After verifying the download and extracting the archive, move `OpenCode-Front.app` to Applications and clear the quarantine attribute before opening:
          
          ```sh
          xattr -dr com.apple.quarantine "/Applications/OpenCode-Front.app"
          ```
          
          RELEASE_NOTES
          gh release edit 2.0.26.5 --notes-file "$RUNNER_TEMP/release-2.0.26.5.md"
