name: Build client

on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*.[0-9]*", "0.0.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        # Bun 1.3.14 re-resolves the patched Git dependency even with a current lockfile.
        run: bun install --linker=hoisted
      - name: Build frontend
        run: bun run build
      - name: Stage desktop app
        id: stage
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            node scripts/desktop-stage.cjs "$REF_NAME"
          else
            node scripts/desktop-stage.cjs
          fi
          node -e 'const pkg = require("./dist/desktop-app/package.json"); console.log("version=" + (process.platform === "win32" ? pkg.releaseVersion : pkg.version.split("+")[0]))' >> "$GITHUB_OUTPUT"
      - name: Package desktop app
        run: node scripts/desktop-package.mjs '${{ matrix.platform }}' '${{ matrix.arch }}' '${{ steps.stage.outputs.version }}'
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: >-
          tar -czf dist/opencode-front-macos-${{ matrix.arch }}.tar.gz
          -C dist/desktop OpenCode-Front-darwin-${{ matrix.arch }}
      - name: Verify archived macOS signatures and launch
        if: runner.os == 'macOS'
        env:
          ARCHIVE_PATH: dist/opencode-front-macos-${{ matrix.arch }}.tar.gz
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          tar -xzf "$ARCHIVE_PATH" -C "$VERIFY_DIR"
          python3 scripts/desktop-verify-macos.py "$VERIFY_DIR/OpenCode-Front-darwin-arm64/OpenCode-Front.app"
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/desktop/OpenCode-Front-win32-x64 -DestinationPath dist/opencode-front-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/opencode-front-*.tar.gz
            dist/opencode-front-*.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          merge-multiple: true
          path: artifacts
      - name: Archive frontend plugin examples
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -qr "artifacts/opencode-front-example-plugins-${RELEASE_TAG}.zip" examples/frontend-plugins
      - name: Create release and upload builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber

  cleanup-broken-releases:
    name: Remove superseded broken releases
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'chore(release): retire broken client releases'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete broken releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for tag in 2.0.26.0 2.0.26.3 2.0.26.4; do
            gh release delete "$tag" --cleanup-tag --yes
          done
